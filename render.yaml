services:
  - type: web
    name: confluence-context-qna
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --worker-class gthread --workers 1 --threads 4 --timeout 60 --graceful-timeout 20 --keep-alive 5
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: CONFLUENCE_BASE_URL
        sync: false
      - key: CONFLUENCE_EMAIL
        sync: false
      - key: CONFLUENCE_API_TOKEN
        sync: false
      - key: CONFLUENCE_PAGE_LIMIT
        value: "0"
      - key: CONFLUENCE_SPACE_KEY
        sync: false
      - key: CONFLUENCE_OFFICIAL_SPACES
        sync: false
      - key: CONFLUENCE_SPACE_WEIGHTS
        sync: false
      - key: CONFLUENCE_DOCUMENT_TYPE_WEIGHTS
        value: "정책:4,매뉴얼:3,결정사항:3,이슈:2"
      - key: ADMIN_TOKEN
        sync: false
      - key: SEARCH_TIME_BUDGET_SECONDS
        value: "8"
      - key: SLOW_SEARCH_MS
        value: "6500"
      - key: ASK_CACHE_TTL_SECONDS
        value: "600"
      - key: SEARCH_MAX_CANDIDATES
        value: "120"
      - key: INGEST_FETCH_LIMIT
        value: "20"
      - key: INGEST_BATCH_MAX_SIZE
        value: "40"
      - key: INGEST_BATCH_TIME_BUDGET_SECONDS
        value: "12"
      - key: INGEST_MEMORY_SOFT_LIMIT_MB
        value: "360"
      - key: INGEST_MAX_PAGE_TEXT_CHARS
        value: "450000"
      - key: DATABASE_URL
        fromDatabase:
          name: confluence-context-qna-db
          property: connectionString
databases:
  - name: confluence-context-qna-db
    plan: free
